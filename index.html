<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER HUD v6.0 - MATRIX PERIMETER</title>
    <style>
        :root { 
            --primary-color: #00f2ff;
            --bg-color: #01080e;      
            --box-bg: rgba(2, 12, 22, 0.95); 
            --text-color: #c4faff;
            --error-color: #ff3c3c; 
            --success-color: #3cff8c; 
            --font-family: 'Segoe UI', 'Courier New', monospace;
            --ease-snap: cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        body { 
            background: var(--bg-color);
            color: var(--text-color); 
            font-family: var(--font-family); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .box { 
            background: var(--box-bg);
            padding: 30px;
            border-radius: 8px; 
            position: relative;
            text-align: center; 
            width: 100%; max-width: 450px; display: none; 
            opacity: 0; transform: translate3d(0, 20px, 0);
            backdrop-filter: blur(10px);
            transition: opacity 0.2s var(--ease-snap), transform 0.2s var(--ease-snap);
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .box::before {
            content: "";
            position: absolute;
            inset: -2px; 
            border-radius: 10px;
            padding: 2px; 
            background: conic-gradient(from var(--angle), transparent 70%, var(--primary-color) 100%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            animation: rotateAngle 3s linear infinite;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotateAngle {
            to { --angle: 360deg; }
        }

        .box.active { display: block; opacity: 1; transform: translate3d(0, 0, 0); }
        #adminScreen { max-width: 900px; max-height: 92vh; overflow-y: auto; }

        h2 { 
            margin: 0 0 25px 0;
            text-transform: uppercase; letter-spacing: 5px; 
            font-size: 1.3em; color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            border-bottom: 1px solid rgba(0, 242, 255, 0.2); padding-bottom: 10px;
        }

        input { 
            width: 100%;
            padding: 12px; margin: 10px 0; background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(0, 242, 255, 0.2); color: #fff;
            font-family: var(--font-family); text-align: center; outline: none; 
            box-sizing: border-box; font-size: 16px; border-radius: 4px;
        }
        input:focus { border-color: var(--primary-color); background: rgba(0, 242, 255, 0.05); }

        button { 
            width: 100%;
            padding: 14px; margin-top: 15px; 
            background: rgba(0, 242, 255, 0.1); color: var(--primary-color); 
            border: 1px solid var(--primary-color); font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        button:hover:not(:disabled) { background: var(--primary-color); color: #000; box-shadow: 0 0 20px var(--primary-color); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .profile-container { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 25px; }
        @media (min-width: 768px) { .profile-container { grid-template-columns: 1fr 1fr 1fr; } }

        .code-section { 
            border: 1px solid rgba(0, 242, 255, 0.1);
            padding: 15px; border-radius: 4px; 
            background: rgba(0, 15, 25, 0.4); text-align: left;
        }
        .code-section h4 { 
            margin: 0 0 12px 0;
            font-size: 0.75em; color: var(--primary-color); 
            letter-spacing: 2px; border-bottom: 1px solid rgba(0, 242, 255, 0.1); padding-bottom: 5px;
        }
        .code-list { font-size: 0.85em; height: 250px; overflow-y: auto; color: #85e4ff; }
        .code-item { padding: 6px 0; border-bottom: 1px solid rgba(0, 242, 255, 0.05); }

        .maintenance-top { 
            background: rgba(255, 60, 60, 0.05);
            padding: 10px; margin-bottom: 20px; 
            border-radius: 2px; font-size: 0.75em; border: 1px solid rgba(255, 60, 60, 0.3);
        }
        .clear-options { display: none; gap: 8px; margin-top: 10px; }
        .clear-options.active { display: flex; flex-wrap: wrap; }
        .btn-clear-mini { background: rgba(255, 60, 60, 0.1); color: #ff3c3c;
            border: 1px solid #ff3c3c; padding: 6px; flex: 1; cursor: pointer; min-width: 120px;
        }

        .status-msg { margin-top: 15px; font-size: 0.85em; font-weight: bold; min-height: 20px; }
        .live-indicator { width: 8px; height: 8px; background: var(--success-color); border-radius: 50%; display: inline-block;
            margin-right: 8px; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); }

        /* ===== THAY ĐỔI: CSS NÚT ON/OFF TO HƠN VÀ NỔI BẬT HƠN ===== */
        .toggle-wrapper {
            position: absolute;
            top: -24px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(2, 12, 22, 1);
            border: 2px solid rgba(0, 242, 255, 0.4);
            border-radius: 25px;
            padding: 8px 18px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
        }
        .toggle-label {
            font-size: 0.75em;
            letter-spacing: 2px;
            color: rgba(196, 250, 255, 0.7);
            text-transform: uppercase;
            font-weight: bold;
            user-select: none;
        }
        .toggle-label.mode-label {
            font-size: 0.85em;
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .toggle-label.mode-label.off { color: rgba(196, 250, 255, 0.5); }
        .toggle-label.mode-label.on { 
            color: #ff3c3c; 
            text-shadow: 0 0 10px #ff3c3c, 0 0 20px #ff3c3c; 
        }

        /* Switch toggle to hơn */
        .switch {
            position: relative;
            width: 52px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 242, 255, 0.4);
            border-radius: 25px;
            transition: 0.3s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 2px; bottom: 2px;
            background: rgba(196, 250, 255, 0.5);
            border-radius: 50%;
            transition: 0.3s;
        }
        .switch input:checked + .slider {
            background: rgba(255, 60, 60, 0.15);
            border-color: #ff3c3c;
            box-shadow: inset 0 0 10px rgba(255, 60, 60, 0.3), 0 0 15px rgba(255, 60, 60, 0.5);
        }
        .switch input:checked + .slider:before {
            transform: translateX(26px);
            background: #ff3c3c;
            box-shadow: 0 0 10px #ff3c3c, 0 0 20px #ff3c3c;
        }

        .poison-status-bar {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255, 60, 60, 0.08);
            border: 1px solid rgba(255, 60, 60, 0.4);
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-size: 0.72em;
            letter-spacing: 1px;
            color: #ff3c3c;
            animation: poisonPulse 2s ease-in-out infinite;
        }
        .poison-status-bar.active { display: flex; }
        @keyframes poisonPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 60, 60, 0.2); }
            50% { box-shadow: 0 0 15px rgba(255, 60, 60, 0.5); }
        }
        .poison-dot {
            width: 7px; height: 7px; background: #ff3c3c; border-radius: 50%;
            animation: blink 0.8s infinite; flex-shrink: 0;
        }

        /* ===== THAY ĐỔI: MEDIA QUERIES TỐI ƯU MOBILE ===== */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .box { 
                padding: 25px 15px; 
                margin-top: 15px; /* Tránh chạm sát viền trên màn hình */
            }
            
            /* Căn lại nút toggle trên mobile để không lẹm viền */
            .toggle-wrapper {
                top: -18px;
                right: 50%;
                transform: translateX(50%); /* Căn giữa trên đỉnh màn nhỏ */
                padding: 6px 12px;
                gap: 8px;
                background: rgba(2, 12, 22, 1);
            }
            .toggle-label { font-size: 0.65em; }
            .toggle-label.mode-label { font-size: 0.75em; }
            .switch { width: 44px; height: 22px; }
            .slider:before { height: 14px; width: 14px; }
            .switch input:checked + .slider:before { transform: translateX(22px); }

            h2 { font-size: 1.1em; margin-top: 15px; }
            
            /* Tăng kích thước chạm cho input/button */
            input { padding: 15px; font-size: 1.05em; }
            button { padding: 16px; font-size: 1em; }
            
            /* Tối ưu danh sách mã code dễ đọc hơn */
            .profile-container { gap: 20px; }
            .code-section { padding: 12px; }
            .code-list { height: 220px; font-size: 0.95em; }
            .code-item { padding: 10px 0; } /* Rộng ra để dễ nhìn / dễ cuộn */
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="loginScreen" class="box active">
        <h2>XÁC THỰC DANH TÍNH</h2>
        <input type="text" id="userLogin" placeholder="TÀI KHOẢN" autocomplete="off" autofocus>
        <input type="password" id="passLogin" placeholder="MẬT MÃ TRUY CẬP">
        <button id="btnLogin" onclick="handleLogin()">KHỞI TẠO SESSION</button>
        <p onclick="showScreen('registerScreen')" style="cursor:pointer; font-size:0.7em; margin-top:20px; opacity:0.6; text-decoration: underline;">TẠO TÀI KHOẢN MỚI</p>
        <p id="loginStatus" class="status-msg"></p>
    </div>

    <div id="registerScreen" class="box">
        <h2>GHI DANH HỆ THỐNG</h2>
        <input type="text" id="userReg" placeholder="TÀI KHOẢN MỚI">
        <input type="password" id="passReg" placeholder="MẬT MÃ MỚI">
        <button id="btnReg" onclick="handleRegister()">XÁC NHẬN ĐĂNG KÝ</button>
        <p onclick="showScreen('loginScreen')" style="cursor:pointer; font-size:0.7em; margin-top:20px; opacity:0.6; text-decoration: underline;">QUAY LẠI ĐĂNG NHẬP</p>
        <p id="regStatus" class="status-msg"></p>
    </div>

    <div id="adminScreen" class="box">
        <div class="toggle-wrapper" title="Kích hoạt: web check mã sẽ luôn báo DÍNH MÃ ĐỘC dù nhập đúng hay sai">
            <span class="toggle-label">MÃ ĐỘC</span>
            <label class="switch">
                <input type="checkbox" id="poisonToggle" onchange="handlePoisonToggle()">
                <span class="slider"></span>
            </label>
            <span class="toggle-label mode-label off" id="toggleModeLabel">OFF</span>
        </div>

        <div class="maintenance-top">
            <div style="color: #ff3c3c; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between;" onclick="toggleClearMenu()">
                <span>[!] KHU VỰC BẢO TRÌ HỆ THỐNG</span><span>▼</span>
            </div>
            <div id="clearMenu" class="clear-options">
                <button class="btn-clear-mini" onclick="confirmClear('all')">XÓA TOÀN BỘ</button>
                <button class="btn-clear-mini" onclick="confirmClear('used')">XÓA ĐÃ SỬ DỤNG</button>
                <button class="btn-clear-mini" onclick="confirmClear('created')">XÓA ĐÃ TẠO</button>
            </div>
        </div>

        <h2>BẢNG ĐIỀU KHIỂN</h2>

        <div class="poison-status-bar" id="poisonStatusBar">
            <span class="poison-dot"></span>
            CHẾ ĐỘ MÃ ĐỘC ĐANG HOẠT ĐỘNG 
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(0,242,255,0.1); padding-bottom: 10px;">
            <p style="margin:0"><span class="live-indicator"></span>USER: <span id="userNameDisp" style="color: var(--primary-color)"></span></p>
            <button onclick="location.reload()" style="width:auto; padding:5px 12px; background:rgba(255,60,60,0.1); color:#ff3c3c; font-size:0.7em; border: 1px solid #ff3c3c; margin:0; clip-path:none;">THOÁT</button>
        </div>

        <div style="background: rgba(0, 242, 255, 0.02); padding: 15px; border: 1px solid rgba(0, 242, 255, 0.1);">
            <div style="display:flex; gap:10px;">
                <input type="text" id="vipCode" style="margin:0" placeholder="NHẬP MÃ VIP..." autocomplete="off">
                <button id="btnAddCode" style="margin:0; width:40%;" onclick="handleAddCode()">KÍCH HOẠT</button>
            </div>
        </div>

        <div class="profile-container">
            <div class="code-section"><h4>[ĐÃ TẠO]</h4><div id="listCreated" class="code-list"></div></div>
            <div class="code-section"><h4>[SẴN SÀNG]</h4><div id="listUnused" class="code-list"></div></div>
            <div class="code-section"><h4>[ĐÃ DÙNG]</h4><div id="listUsed" class="code-list"></div></div>
        </div>
        <p id="adminStatus" class="status-msg"></p>
    </div>

    <script>
        // --- 1. HIỆU ỨNG MATRIX CANVAS ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01010101ABCDEF0123456789";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(1, 8, 14, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2ff";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- 2. LOGIC CHÍNH ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvUl8eJ7L8qGRu9f8l-u4Db_-pwhGuESmvOGeO18coUtYHc2pyVimeFQpPhicuLsWM/exec";
        let currentLoggedUser = "";
        let localData = { created: [], used: [], unused: [] };

        // Xử lý phím Enter tối ưu
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const activeBox = document.querySelector('.box.active');
                if (!activeBox) return;

                if (document.activeElement.id === 'userLogin') {
                    document.getElementById('passLogin').focus();
                    return;
                }
                if (document.activeElement.id === 'userReg') {
                    document.getElementById('passReg').focus();
                    return;
                }

                const btn = activeBox.querySelector('button:not(.sync-btn):not(.btn-clear-mini)');
                if (btn && !btn.disabled) btn.click();
            }
        });

        setInterval(() => {
            if (!document.hidden && document.getElementById('adminScreen').classList.contains('active')) {
                refreshUserData(false); 
            }
        }, 3000);

        function showScreen(screenId) {
            document.querySelectorAll('.box').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(screenId);
            target.classList.add('active');
            
            setTimeout(() => {
                const input = target.querySelector('input');
                if (input) input.focus();
            }, 50);
        }

        // ===== THAY ĐỔI: SỬA LỖI HIỂN THỊ [object Object] =====
        function renderAllLists() {
            const render = (id, list) => {
                const el = document.getElementById(id);
                el.innerHTML = list.length ? list.map(c => {
                    // Chiết xuất chuỗi code từ object do Server trả về, hoặc hiển thị trực tiếp nếu là string
                    let codeText = (typeof c === 'object' && c !== null) ? c.code : c;
                    return `<div class="code-item">> ${codeText}</div>`;
                }).reverse().join('') : '<div style="opacity:0.2; padding:10px;">EMPTY</div>';
            };
            render('listCreated', localData.created); render('listUsed', localData.used); render('listUnused', localData.unused);
        }
        // ===== KẾT THÚC SỬA LỖI =====

        async function refreshUserData() {
            if (!currentLoggedUser) return;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getUserData&username=${currentLoggedUser}`);
                const newData = await res.json();
                if (JSON.stringify(localData) !== JSON.stringify(newData)) {
                    localData = newData;
                    renderAllLists();
                }
            } catch (e) { console.error("Sync Error"); }
        }

        async function handleLogin() {
            const u = document.getElementById('userLogin').value.trim();
            const p = document.getElementById('passLogin').value.trim();
            const status = document.getElementById('loginStatus');
            const btn = document.getElementById('btnLogin');
            if(!u || !p) return;
            
            btn.disabled = true;
            status.textContent = "AUTHENTICATING...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username: u, password: p }),
                    headers: { "Content-Type": "text/plain" }
                });
                const res = await response.text();
                
                if(res === "success") {
                    currentLoggedUser = u;
                    document.getElementById('userNameDisp').textContent = u.toUpperCase();
                    showScreen('adminScreen');
                    refreshUserData();
                    
                    // Gọi API lấy trạng thái ON/OFF ngay khi đăng nhập thành công
                    loadPoisonState();
                } else {
                    status.className = "status-msg error";
                    status.textContent = "SAI THÔNG TIN"; 
                    btn.disabled = false;
                }
            } catch(e) { 
                status.textContent = "LỖI KẾT NỐI";
                btn.disabled = false; 
            }
        }

        async function handleAddCode() {
            const input = document.getElementById('vipCode');
            const code = input.value.trim().toUpperCase();
            if(!code) return;
            
            // Push string lên giao diện (sẽ được handle an toàn ở hàm render bên trên)
            localData.created.push(code); 
            localData.unused.push(code); 
            renderAllLists();
            input.value = "";
            input.focus();
            
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "add", code: code, username: currentLoggedUser }),
                headers: { "Content-Type": "text/plain" }
            });
        }

        async function handleRegister() {
            const u = document.getElementById('userReg').value.trim();
            const p = document.getElementById('passReg').value.trim();
            const btn = document.getElementById('btnReg');
            if(!u || !p) return;
            
            btn.disabled = true;
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "register", username: u, password: p }),
                    headers: { "Content-Type": "text/plain" }
                }).then(r => r.text());
                
                if(res === "success") { 
                    alert("GHI DANH THÀNH CÔNG!");
                    showScreen('loginScreen'); 
                } else { 
                    alert("TÀI KHOẢN ĐÃ TỒN TẠI");
                }
            } catch(e) {}
            btn.disabled = false;
        }

        function toggleClearMenu() { document.getElementById('clearMenu').classList.toggle('active'); }
        async function confirmClear(type) {
            if (!confirm("XÁC NHẬN PHÁ HỦY DỮ LIỆU?")) return;
            toggleClearMenu();
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "clearData", type: type, username: currentLoggedUser }),
                headers: { "Content-Type": "text/plain" }
            }).then(() => refreshUserData());
        }

        // ===== LOGIC ON/OFF MÃ ĐỘC =====
        const POISON_KEY = "POISON_MODE_ACTIVE";
        
        async function loadPoisonState() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getOnOff`);
                const data = await res.json();
                const isOn = (data.state === "ON");
                localStorage.setItem(POISON_KEY, isOn ? "1" : "0");
                document.getElementById('poisonToggle').checked = isOn;
                updatePoisonUI(isOn);
            } catch (e) {
                console.warn("Lấy trạng thái server lỗi, dùng Local Storage thay thế.");
                const saved = localStorage.getItem(POISON_KEY);
                const isOn = saved === "1";
                document.getElementById('poisonToggle').checked = isOn;
                updatePoisonUI(isOn);
            }
        }

        function handlePoisonToggle() {
            const isOn = document.getElementById('poisonToggle').checked;
            const stateStr = isOn ? "ON" : "OFF";
            
            localStorage.setItem(POISON_KEY, isOn ? "1" : "0");
            updatePoisonUI(isOn);
            
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "setOnOff", state: stateStr }),
                headers: { "Content-Type": "text/plain" }
            }).catch(e => console.error("Lỗi đồng bộ ON/OFF lên server: ", e));
        }

        function updatePoisonUI(isOn) {
            const label = document.getElementById('toggleModeLabel');
            const statusBar = document.getElementById('poisonStatusBar');
            if (isOn) {
                label.textContent = "ON";
                label.className = "toggle-label mode-label on";
                statusBar.classList.add('active');
            } else {
                label.textContent = "OFF";
                label.className = "toggle-label mode-label off";
                statusBar.classList.remove('active');
            }
        }
        // ===== END LOGIC ON/OFF =====
    </script>
</body>
</html>
